[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netpip"
version = "0.1.0"
description = "Command-line risk checks for MetaTrader 5 Expert Advisors."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Novhaz" }]

[project.urls]
Homepage = "https://github.com/netpip/netpip"

[project.scripts]
netpip = "netpip.cli:main"
